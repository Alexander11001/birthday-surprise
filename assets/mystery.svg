<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#330066"/>
      <stop offset="50%" stop-color="#ff0099"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <pattern id="stars" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2" fill="#fff" opacity="0.8"/>
      <circle cx="25" cy="20" r="1.5" fill="#ff0"/>
      <circle cx="35" cy="8" r="1" fill="#0ff"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="420" height="420" fill="url(#bg)"/>
  <rect width="420" height="420" fill="url(#stars)" opacity="0.6"/>
  <rect x="30" y="30" width="360" height="360" fill="none" stroke="#ffff00" stroke-width="8" stroke-dasharray="20 12"/>
  <text x="210" y="130" font-family="Impact,Arial Black,sans-serif" font-size="52" fill="#00ff00" text-anchor="middle" filter="url(#glow)">TOP SECRET</text>
  <text x="210" y="200" font-family="Comic Sans MS,cursive,sans-serif" font-size="140" fill="#fff" text-anchor="middle" stroke="#ff0000" stroke-width="4">?</text>
  <ellipse cx="210" cy="280" rx="120" ry="40" fill="#000" opacity="0.4"/>
  <text x="210" y="295" font-family="Arial,sans-serif" font-size="22" fill="#ffff00" text-anchor="middle" font-weight="bold">КТО ИМЕНИННИК?!</text>
  <text x="210" y="330" font-family="Arial,sans-serif" font-size="16" fill="#0ff" text-anchor="middle">[ НАЖМИ МЕНЯ ]</text>
  <text x="210" y="380" font-family="monospace" font-size="14" fill="#ff69b4" text-anchor="middle">www.birthday2006.narod.ru</text>
</svg>
